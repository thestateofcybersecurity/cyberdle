<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Cyberdle: a daily Wordle-style game for cybersecurity acronyms. Guess the acronym, learn what it means." />
  <title>Cyberdle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b1117'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='%2350fa9c' font-family='monospace' font-weight='bold'>C</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="crt" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-side topbar-left">
      <button class="icon-btn" id="btn-help" aria-label="How to play" title="How to play">?</button>
    </div>
    <h1 class="brand"><span class="brand-prompt">&gt;</span>CYBERDLE<span class="brand-cursor">_</span></h1>
    <div class="topbar-side topbar-right">
      <button class="icon-btn" id="btn-stats" aria-label="Statistics" title="Statistics">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="4" y="12" width="4" height="8"/><rect x="10" y="6" width="4" height="14"/><rect x="16" y="9" width="4" height="11"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      </button>
    </div>
  </header>

  <nav class="mode-switch" role="tablist" aria-label="Game mode">
    <button class="mode-tab" id="tab-daily" role="tab" aria-selected="true">DAILY</button>
    <button class="mode-tab" id="tab-practice" role="tab" aria-selected="false">PRACTICE</button>
  </nav>

  <div class="practice-bar" id="practice-bar" hidden>
    <label class="select-wrap">
      <span>difficulty</span>
      <select id="filter-difficulty">
        <option value="">any</option>
        <option value="easy">easy</option>
        <option value="medium">medium</option>
        <option value="hard">hard</option>
      </select>
    </label>
    <label class="select-wrap">
      <span>category</span>
      <select id="filter-category">
        <option value="">any</option>
      </select>
    </label>
    <button class="ghost-btn" id="btn-new-game">new game</button>
  </div>

  <div class="status-line" id="status-line"></div>

  <main class="stage">
    <div id="game-board" class="board" role="grid" aria-label="Guess grid"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="deck">
    <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
  </footer>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" id="btn-close-modal" aria-label="Close">&times;</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </section>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
