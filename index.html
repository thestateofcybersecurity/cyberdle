<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b1117" />
  <meta name="description" content="Cyberdle: a daily Wordle-style game for cybersecurity acronyms. Guess the acronym, learn what it means." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Cyberdle" />
  <meta property="og:description" content="A daily Wordle-style game for cybersecurity acronyms. Six guesses, then the full expansion, a plain-English explanation, and sources." />
  <meta property="og:url" content="https://thestateofcybersecurity.github.io/cyberdle/" />
  <meta property="og:image" content="https://thestateofcybersecurity.github.io/cyberdle/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cyberdle" />
  <meta name="twitter:description" content="A daily Wordle-style game for cybersecurity acronyms." />
  <meta name="twitter:image" content="https://thestateofcybersecurity.github.io/cyberdle/og-image.png" />
  <title>Cyberdle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="crt" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-side topbar-left">
      <button class="icon-btn" id="btn-help" aria-label="How to play" title="How to play">?</button>
      <button class="icon-btn" id="btn-archive" aria-label="Puzzle archive" title="Puzzle archive">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      </button>
    </div>
    <h1 class="brand"><span class="brand-prompt">&gt;</span>CYBERDLE<span class="brand-cursor">_</span></h1>
    <div class="topbar-side topbar-right">
      <button class="icon-btn" id="btn-stats" aria-label="Statistics" title="Statistics">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="4" y="12" width="4" height="8"/><rect x="10" y="6" width="4" height="14"/><rect x="16" y="9" width="4" height="11"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      </button>
    </div>
  </header>

  <nav class="mode-switch" role="tablist" aria-label="View">
    <button class="mode-tab" id="tab-daily" role="tab" aria-selected="true">DAILY</button>
    <button class="mode-tab" id="tab-practice" role="tab" aria-selected="false">PRACTICE</button>
    <button class="mode-tab" id="tab-study" role="tab" aria-selected="false">STUDY</button>
    <button class="mode-tab" id="tab-glossary" role="tab" aria-selected="false">GLOSSARY</button>
  </nav>

  <div class="practice-bar" id="practice-bar" hidden>
    <label class="select-wrap">
      <span>difficulty</span>
      <select id="filter-difficulty">
        <option value="">any</option>
        <option value="easy">easy</option>
        <option value="medium">medium</option>
        <option value="hard">hard</option>
      </select>
    </label>
    <label class="select-wrap">
      <span>category</span>
      <select id="filter-category">
        <option value="">any</option>
        <option value="__missed">my misses</option>
      </select>
    </label>
    <button class="ghost-btn" id="btn-new-game">new game</button>
  </div>

  <div class="status-line" id="status-line"></div>

  <main class="stage">
    <div id="game-board" class="board" role="grid" aria-label="Guess grid"></div>

    <section id="glossary-panel" class="panel" hidden aria-label="Glossary">
      <div class="panel-controls">
        <input id="glossary-search" class="text-input" type="search" placeholder="search acronyms, expansions, explanations..." aria-label="Search glossary" />
        <select id="glossary-category" class="panel-select" aria-label="Filter by category">
          <option value="">all categories</option>
        </select>
        <select id="glossary-difficulty" class="panel-select" aria-label="Filter by difficulty">
          <option value="">all difficulties</option>
          <option value="easy">easy</option>
          <option value="medium">medium</option>
          <option value="hard">hard</option>
        </select>
      </div>
      <div id="glossary-count" class="panel-count"></div>
      <div id="glossary-list" class="glossary-list"></div>
    </section>

    <section id="study-panel" class="panel" hidden aria-label="Study">
      <div id="study-card" class="study-card"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="deck">
    <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
  </footer>

  <p class="soup-colophon">
    Part of the <a href="https://www.cybersecurityalphabetsoup.com/" rel="noopener">Cybersecurity Alphabet Soup ecosystem</a>
    &middot; <a href="https://www.cybersecurityalphabetsoup.com/about/" rel="noopener">Meet the builder</a>
  </p>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" id="btn-close-modal" aria-label="Close">&times;</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </section>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
